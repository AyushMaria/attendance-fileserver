{% extends "base.html" %}
{% block title %}Sign in · Attendance{% endblock %}
{% block body %}
<div class="login card">
  <h1>Sign in</h1>
  <p class="sub">Use the username and password you were given.</p>
  {% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="u">Username</label>
      <input id="u" type="text" name="username" value="{{ username }}" autocomplete="username"
             autocapitalize="none" autocorrect="off" required autofocus></div>
    <div class="field"><label for="p">Password</label>
      <input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" name="remember"> Keep me signed in (not on a shared PC)</label>
    <div style="margin-top:12px"><button type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
