; ============================================================================
;  Settings for ONE store.
;
;  First-time setup: copy this file to  store_config.ini  (same folder) and
;  fill it in. store_config.ini is ignored by git, so:
;    - `git pull` updates the code without ever touching these settings
;    - the sync key in it never ends up on GitHub
;
;  Lines starting with ; are notes.
; ============================================================================

[store]
; This store's name, e.g. mall or nirala. Used in the log only - the
; website decides which store is sending from the sync key, not this.
name = store-name-here


[device]
; The eSSL K90 Pro at this store. On the device: Menu > Comm > Ethernet
ip = 192.168.1.201
port = 4370
; The device's "Comm Key". 0 if none is set.
comm_password = 0
; Seconds to wait for the device before giving up.
timeout = 10


[sync]
; The attendance website. Include https:// - a trailing slash is fine.
server_url = https://your-app.up.railway.app
; This store's own key. The Owner enters the same key on the website's
; Stores page ("Enter key"). The website works out which store is sending
; from the key alone, so each store must have a different one.
sync_key = put-this-stores-sync-key-here
; How many days back each run re-sends. The website ignores punches it
; already has, so a PC that was off for a weekend catches up next run.
lookback_days = 3
