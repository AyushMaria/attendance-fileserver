; ============================================================================
;  Settings for ONE store.
;
;  First-time setup: copy this file to  store_config.ini  (same folder) and
;  fill it in. store_config.ini is ignored by git, so:
;    - `git pull` updates the code without ever touching these settings
;    - the upload token in it never ends up on GitHub
;
;  Write Windows paths normally, e.g.  E:\Attendance\attendance_reports
;  (no doubled backslashes, no quotes needed). Lines starting with ; are notes.
; ============================================================================

[store]
; This store's name on the file server, e.g. mall or nirala.
; Must be different at every store - daily reports have the same filename
; everywhere, so two stores sharing a name would overwrite each other.
; Letters, numbers, hyphens and underscores only.
name = store-name-here


[device]
; The eSSL K90 Pro at this store. On the device: Menu > Comm > Ethernet
ip = 192.168.1.201
port = 4370
; The device's "Comm Key". 0 if none is set.
comm_password = 0
; Seconds to wait for the device before giving up.
timeout = 10
; Expected start time - the dashed line on the daily timeline chart.
expected_start = 09:00


[paths]
; Where the Excel reports are written, and where the uploader reads them.
; Keep this OUTSIDE the code folder so reports never mix with code.
reports_folder = E:\Attendance\attendance_reports


[upload]
; The Railway file server. Include https:// - a trailing slash is fine.
server_url = https://your-app.up.railway.app
upload_token = put-your-upload-token-here
; How far back to look each run. Files already on the server are skipped,
; so a week just means a missed day gets filled in on the next run.
max_age_hours = 168


[sync]
; Used by the next version (live calendars), which reads the device and
; sends punches straight to the website every 30 minutes. Not used yet -
; it is filled in now so that version can start without visiting the store.
; The key is this store's own; the website is told the same key later.
server_url = https://your-app.up.railway.app
sync_key = put-this-stores-sync-key-here
lookback_days = 3
